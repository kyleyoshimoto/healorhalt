[project]
name = "healorhalt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kyle Yoshimoto", email = "kyle.yoshimoto@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "appium-python-client>=6.1.4",
    "lxml>=6.1.3",
    "ollama>=0.6.3",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
healorhalt = "healorhalt.cli:main"

[project.entry-points.pytest11]
healorhalt = "healorhalt.plugin"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p pytester"
healorhalt_locators = "tests/demo/locators.yaml"
healorhalt_bundle_id = "com.healorhalt.pantry"
healorhalt_app = "apps/demo-ios/build/Build/Products/Debug-iphonesimulator/Pantry.app"
markers = ["sim: needs a booted iOS Simulator and Appium (skipped in hosted CI)"]
