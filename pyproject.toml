[project]
name = "healorhalt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kyle Yoshimoto", email = "kyle.yoshimoto@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "appium-python-client>=6.1.4",
    "ollama>=0.6.3",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
]

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["sim: needs a booted iOS Simulator and Appium (skipped in hosted CI)"]
